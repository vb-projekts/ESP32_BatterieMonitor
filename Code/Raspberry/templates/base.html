<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}ESP32 Monitor{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <nav class="topnav">
        <div class="nav-links">
            <a href="/" class="{{ 'active' if request.path == '/' else '' }}">&#128421;&#65039; Übersicht</a>
            <a href="/wasser" class="{{ 'active' if request.path == '/wasser' else '' }}">&#128167; Wasserverbrauch</a>
            <a href="/garage" class="{{ 'active' if request.path == '/garage' else '' }}">&#128663; Garage</a>
            <a href="/admin" class="{{ 'active' if request.path.startswith('/admin') else '' }}">&#9881;&#65039; Admin</a>
        </div>
        <span class="version-tag" id="version-tag">v{{ server_version }}</span>
    </nav>
    <div class="page-content">
        {% block content %}{% endblock %}
    </div>
    <script src="{{ url_for('static', filename='js/common.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
