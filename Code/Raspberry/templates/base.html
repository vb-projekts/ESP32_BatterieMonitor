<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}ESP32 Monitor{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <!-- ============================================================
         Navigation - zentrale Stelle fuer alle Seiten.
         Neue Seite hinzufügen = 1) Route in server.py, 2) Template
         das "base.html" erweitert, 3) hier einen <a> Eintrag ergänzen.
         Aktive Seite wird automatisch per request.path markiert.
    ============================================================ -->
    <nav class="topnav">
        <div class="nav-links">
            <a href="/" class="{{ 'active' if request.path == '/' else '' }}">&#128421;&#65039; Übersicht</a>
            <a href="/wasser" class="{{ 'active' if request.path == '/wasser' else '' }}">&#128167; Wasserverbrauch</a>
            <a href="/admin" class="{{ 'active' if request.path.startswith('/admin') else '' }}">&#9881;&#65039; Admin</a>
        </div>
        <span class="version-tag" id="version-tag">v{{ server_version }}</span>
    </nav>

    <div class="page-content">
        {% block content %}{% endblock %}
    </div>

    <!-- Gemeinsame Helfer (escapeHtml, statusBadge, ...) für ALLE Seiten,
         danach folgt das seitenspezifische Skript über den scripts-Block weiter unten -->
    <script src="{{ url_for('static', filename='js/common.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
